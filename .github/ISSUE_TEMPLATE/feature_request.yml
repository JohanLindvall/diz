name: Feature request
description: Suggest a useful workflow or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: What are you trying to do?
      description: Describe the workflow and the limitation you encounter today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example command or expected result if it helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: What have you tried, and why does it fall short?

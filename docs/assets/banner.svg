<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">diz — Docker images, packed to go.</title>
  <desc id="description">Select Docker images, bundle them in a portable ZIP archive, then restore them to Docker or serve them through a local registry.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101f33"/>
      <stop offset="1" stop-color="#07121f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#54748d" stroke-opacity=".1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="m0 0 6 3-6 3" fill="none" stroke="#67e8c0" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <g font-family="DejaVu Sans, sans-serif">
    <circle cx="72" cy="58" r="5" fill="#67e8c0"/>
    <text x="91" y="64" font-size="14" letter-spacing="2" fill="#9cb7cc">DOCKER IMAGE ZIP</text>
    <text x="1216" y="64" text-anchor="end" font-size="14" letter-spacing="2" fill="#9cb7cc">OPEN SOURCE / MIT</text>

    <text x="60" y="190" font-size="120" font-weight="bold" letter-spacing="-7" fill="#67e8c0">diz</text>
    <path d="M292 100v108" stroke="#355168" stroke-width="2"/>
    <text x="344" y="133" font-size="43" font-weight="bold" letter-spacing="-1" fill="#f3f8fc">Docker images, packed to go.</text>
    <text x="346" y="183" font-size="22" fill="#a6bfd1">Bundle. Update. Restore. Serve.</text>

    <rect x="64" y="278" width="280" height="208" rx="18" fill="#14273a" stroke="#314d63"/>
    <text x="88" y="315" font-size="13" letter-spacing="2" fill="#99b6cb">01 / SELECT</text>
    <g fill="#203e55" stroke="#7dd3fc" stroke-width="2">
      <rect x="91" y="344" width="54" height="24" rx="4"/>
      <rect x="91" y="375" width="54" height="24" rx="4"/>
      <path d="M104 352v8m12-8v8m12-8v8m-24 23v8m12-8v8m12-8v8"/>
    </g>
    <text x="166" y="365" font-size="23" font-weight="bold" fill="#f3f8fc">Docker</text>
    <text x="166" y="396" font-size="23" font-weight="bold" fill="#f3f8fc">images</text>
    <text x="88" y="452" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#a6bfd1">app:v1   db:v2</text>

    <text x="391" y="360" text-anchor="middle" font-size="13" fill="#a6bfd1">create</text>
    <path d="M365 384h60" fill="none" stroke="#67e8c0" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="448" y="278" width="348" height="208" rx="18" fill="#103336" stroke="#67e8c0" stroke-opacity=".7"/>
    <text x="474" y="315" font-size="13" letter-spacing="2" fill="#a0dfcf">02 / PACK</text>
    <path d="M481 343h34l18 18v45h-52z" fill="#194a48" stroke="#67e8c0" stroke-width="2"/>
    <path d="M515 343v18h18m-28 4h6m-6 8h6m-6 8h6m-6 8h6" fill="none" stroke="#67e8c0" stroke-width="3"/>
    <text x="554" y="385" font-family="DejaVu Sans Mono, monospace" font-size="26" font-weight="bold" fill="#f3f8fc">images.diz</text>
    <text x="474" y="452" font-size="19" fill="#b3ddd2">One portable ZIP archive</text>

    <text x="845" y="360" text-anchor="middle" font-size="13" fill="#a6bfd1">open</text>
    <path d="M817 384h59" fill="none" stroke="#67e8c0" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="896" y="278" width="320" height="208" rx="18" fill="#14273a" stroke="#314d63"/>
    <text x="922" y="315" font-size="13" letter-spacing="2" fill="#99b6cb">03 / USE</text>
    <g fill="none" stroke="#7dd3fc" stroke-width="2">
      <rect x="923" y="350" width="24" height="24" rx="4"/>
      <path d="M929 358h12m-12 7h12"/>
      <circle cx="935" cy="423" r="12"/>
      <path d="M923 423h24m-12-12c-7 7-7 17 0 24m0-24c7 7 7 17 0 24"/>
    </g>
    <text x="965" y="369" font-size="19" fill="#f3f8fc">Restore to Docker</text>
    <path d="M922 395h268" stroke="#314d63"/>
    <text x="965" y="430" font-size="19" fill="#f3f8fc">Serve a registry</text>

    <text x="64" y="551" font-size="21" fill="#d6e5ef">For offline transfers, image bundles, and local distribution.</text>
    <text x="64" y="596" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#91aec5">github.com/JohanLindvall/diz</text>
    <text x="1216" y="596" text-anchor="end" font-size="14" letter-spacing="2" fill="#67e8c0">GO + ZIP</text>
  </g>
</svg>
